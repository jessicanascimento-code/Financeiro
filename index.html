<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasero 96 — Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brasero-black:#0c0a09;
    --brasero-black-soft:#171310;
    --brasero-red:#e0231a;
    --brasero-orange:#ff7a1a;
    --brasero-yellow:#ffc42e;
    --brasero-green:#3fb950;
    --brasero-cream:#fff6e9;
    --muted:#a89a8c;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,122,26,.18), transparent 60%), var(--brasero-black);
    color:var(--brasero-cream);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 14px 60px;
  }
  h1.brand{
    font-family:'Poppins',sans-serif; font-weight:800; font-size:22px; margin:6px 0 2px;
    color:var(--brasero-orange);
  }
  p.sub{ margin:0 0 20px; font-size:13px; color:var(--muted); }

  .card{
    width:100%; max-width:480px;
    background:var(--brasero-black-soft);
    border:1px solid #2a2119; border-radius:var(--radius);
    padding:22px; margin-bottom:16px;
  }
  label{ display:block; font-size:12.5px; font-weight:600; margin:10px 0 4px; }
  label.first{ margin-top:0; }
  input, select, textarea{
    width:100%; -webkit-appearance:none; appearance:none;
    background:#0c0a09; border:1.5px solid #382c22; border-radius:9px;
    padding:10px 11px; color:var(--brasero-cream); font-family:'Inter',sans-serif;
    font-size:15px; outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--brasero-orange); }
  .grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }

  button{
    font-family:'Poppins',sans-serif; font-weight:700; font-size:14px;
    border:none; border-radius:10px; padding:13px 16px; cursor:pointer; width:100%;
    margin-top:14px;
  }
  .btn-primary{ background:linear-gradient(90deg,var(--brasero-red),var(--brasero-orange)); color:#fff; }
  .btn-secondary{ background:transparent; color:var(--muted); border:1.5px solid #382c22; }
  .btn-green{ background:var(--brasero-green); color:#04170a; }

  .status-msg{ text-align:center; font-size:12.5px; margin-top:10px; min-height:16px; }

  /* login */
  #tela-login{ width:100%; max-width:380px; margin-top:10vh; text-align:center; }
  #tela-login .card{ text-align:left; }

  /* tabs */
  #app{ display:none; width:100%; max-width:480px; }
  .tabs{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn{
    flex-shrink:0; background:#171310; color:var(--muted); border:1px solid #2a2119;
    border-radius:20px; padding:9px 16px; font-size:12.5px; font-weight:700;
    font-family:'Poppins',sans-serif; cursor:pointer; width:auto; margin:0;
  }
  .tab-btn.ativa{ background:linear-gradient(90deg,var(--brasero-red),var(--brasero-orange)); color:#fff; border-color:transparent; }
  .tab-conteudo{ display:none; }
  .tab-conteudo.ativa{ display:block; }

  .produto-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:9px 0; border-bottom:1px solid #241c15; font-size:13px;
  }
  .produto-row:last-child{ border-bottom:none; }
  .produto-row .nome{ flex:1; font-weight:600; }
  .produto-row input{ width:80px !important; padding:6px 8px !important; font-size:13px; text-align:right; }

  .resumo-linha{ display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px solid #241c15; }
  .resumo-linha:last-child{ border:none; }
  .resumo-linha b{ color:var(--brasero-yellow); }
  .resumo-linha.total{ font-size:17px; font-weight:800; margin-top:8px; padding-top:12px; border-top:2px solid var(--brasero-orange); }
  .resumo-linha.total b{ color:var(--brasero-green); }
  .resumo-linha.total.negativo b{ color:#ff6b6b; }

  .top-bar{ display:flex; justify-content:space-between; align-items:center; width:100%; max-width:480px; margin-bottom:6px; }
  .top-bar span{ font-size:12.5px; color:var(--muted); }
  .top-bar button{ width:auto; margin:0; padding:6px 12px; font-size:11.5px; background:transparent; color:var(--muted); border:1px solid #382c22; }

  .venda-total-preview{
    background:#0c0a09; border:1px solid var(--brasero-orange); border-radius:10px;
    padding:12px; margin-top:14px; text-align:center; font-size:14px;
  }
  .venda-total-preview b{ color:var(--brasero-yellow); font-size:20px; display:block; margin-top:4px; }

  .carrinho-item{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:#0c0a09; border:1px solid #2a2119; border-radius:9px;
    padding:9px 12px; margin-bottom:8px; font-size:13px;
  }
  .carrinho-item .info{ flex:1; }
  .carrinho-item .info b{ display:block; color:var(--brasero-cream); }
  .carrinho-item .info span{ font-size:11.5px; color:var(--muted); }
  .carrinho-item .remover{
    width:auto; margin:0; padding:5px 9px; font-size:11px;
    background:transparent; color:#ff8a80; border:1px solid #4a2e2c;
  }

  .registro-item{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:8px 0; border-bottom:1px solid #241c15; font-size:12.5px;
  }
  .registro-item:last-child{ border-bottom:none; }
  .registro-item .info b{ display:block; font-size:13px; }
  .registro-item .info span{ color:var(--muted); font-size:11px; }
  .registro-item .valor{ font-weight:700; white-space:nowrap; }
  .registro-item .valor.saida{ color:#ff8a80; }
  .registro-item .valor.entrada{ color:var(--brasero-green); }
  .dia-total-linha{
    display:flex; justify-content:space-between; margin-top:10px; padding-top:10px;
    border-top:2px solid var(--brasero-orange); font-size:14px; font-weight:800;
  }
  .dia-total-linha b{ color:var(--brasero-yellow); }
</style>
</head>
<body>

<div id="tela-login">
  <h1 class="brand">🔥 BRASERO 96</h1>
  <p class="sub">Sistema Financeiro</p>
  <div class="card">
    <label class="first">Usuário</label>
    <input type="text" id="login-usuario" placeholder="Seu nome">
    <label>PIN</label>
    <input type="password" id="login-pin" inputmode="numeric" placeholder="****">
    <button class="btn-primary" id="btn-login">Entrar</button>
    <p class="status-msg" id="login-status"></p>
  </div>
</div>

<div class="top-bar" id="top-bar" style="display:none;">
  <span>👤 <b id="usuario-logado"></b></span>
  <button id="btn-sair">Sair</button>
</div>

<div id="app">
  <div class="tabs">
    <button class="tab-btn ativa" data-tab="vender">Vender</button>
    <button class="tab-btn" data-tab="movimento">Saída/Entrada</button>
    <button class="tab-btn" data-tab="custos">Custos &amp; Preços</button>
    <button class="tab-btn" data-tab="resumo">Resumo</button>
  </div>

  <!-- ABA VENDER -->
  <div class="tab-conteudo ativa" id="tab-vender">
    <div class="card">
      <label class="first">Data da venda</label>
      <input type="date" id="venda-data">

      <label>Tipo de item</label>
      <select id="venda-tipo">
        <option value="Espeto">Espeto (rua)</option>
        <option value="Refrigerante">Refrigerante</option>
        <option value="Baião de Dois">Baião de Dois</option>
        <option value="Pacote">Pacote (evento)</option>
      </select>

      <div id="venda-campos-produto">
        <label>Produto</label>
        <select id="venda-produto"></select>
        <label>Quantidade</label>
        <input type="number" id="venda-quantidade" min="1" value="1">
      </div>

      <div id="venda-campos-pacote" style="display:none;">
        <label class="first">Nome do evento/cliente</label>
        <input type="text" id="pacote-nome" placeholder="Ex: Aniversário Ana Clara">
        <label>Valor total do evento (R$)</label>
        <input type="number" id="pacote-valor" step="0.01" placeholder="0,00">
        <label>Custo estimado do evento (R$) — opcional</label>
        <input type="number" id="pacote-custo" step="0.01" placeholder="0,00">
      </div>

      <button class="btn-secondary" id="btn-add-carrinho">➕ Adicionar item</button>

      <div id="carrinho-lista" style="margin-top:14px;"></div>

      <div class="venda-total-preview" id="venda-preview" style="display:none;">
        Total do carrinho<b id="venda-preview-valor">R$ 0,00</b>
      </div>

      <button class="btn-primary" id="btn-registrar-venda" style="display:none;">💰 Registrar Venda(s)</button>
      <p class="status-msg" id="venda-status"></p>
    </div>

    <div class="card">
      <p style="margin:0 0 10px; font-family:'Poppins',sans-serif; font-weight:700; color:var(--brasero-yellow);">📋 Registrado em <span id="label-data-lista"></span></p>
      <div id="lista-vendas-dia"><p style="color:var(--muted); font-size:13px;">Carregando...</p></div>
    </div>
  </div>

  <!-- ABA SAÍDA/ENTRADA -->
  <div class="tab-conteudo" id="tab-movimento">
    <div class="card">
      <label class="first">Tipo</label>
      <select id="mov-tipo">
        <option value="saida">Saída (despesa)</option>
        <option value="entrada">Entrada eventual</option>
      </select>
      <label>Categoria</label>
      <select id="mov-categoria"></select>
      <label>Descrição</label>
      <input type="text" id="mov-descricao" placeholder="Ex: Compra de carvão extra">
      <label>Valor (R$)</label>
      <input type="number" id="mov-valor" step="0.01" placeholder="0,00">
      <button class="btn-primary" id="btn-registrar-mov">Registrar</button>
      <p class="status-msg" id="mov-status"></p>
    </div>

    <div class="card">
      <p style="margin:0 0 10px; font-size:13px; color:var(--muted);">Lançamento rápido do custo fixo do dia (vinagrete + farofa + carvão), direto como saída.</p>
      <button class="btn-secondary" id="btn-custos-fixos">📌 Registrar custos fixos de hoje</button>
      <p class="status-msg" id="custos-fixos-status"></p>
    </div>

    <div class="card">
      <p style="margin:0 0 10px; font-family:'Poppins',sans-serif; font-weight:700; color:var(--brasero-yellow);">🔍 Ver registros de dias anteriores</p>
      <div class="grid2">
        <div>
          <label class="first">De</label>
          <input type="date" id="mov-filtro-inicio">
        </div>
        <div>
          <label class="first">Até</label>
          <input type="date" id="mov-filtro-fim">
        </div>
      </div>
      <button class="btn-primary" id="btn-filtrar-mov">Buscar</button>
      <div id="lista-movimentos-filtrados" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- ABA CUSTOS & PREÇOS -->
  <div class="tab-conteudo" id="tab-custos">
    <div class="card">
      <p style="margin:0 0 4px; font-size:13px; color:var(--muted);">Edite custo e preço de qualquer item. Toque em "Salvar" na linha que alterar.</p>
      <div id="lista-produtos-editavel"></div>
    </div>
  </div>

  <!-- ABA RESUMO -->
  <div class="tab-conteudo" id="tab-resumo">
    <div class="card">
      <div class="grid2">
        <div>
          <label class="first">De</label>
          <input type="date" id="resumo-data-inicio">
        </div>
        <div>
          <label class="first">Até</label>
          <input type="date" id="resumo-data-fim">
        </div>
      </div>
      <div class="grid2" style="margin-top:10px;">
        <button class="btn-secondary" id="btn-resumo-hoje" style="margin-top:0;">Hoje</button>
        <button class="btn-secondary" id="btn-resumo-mes" style="margin-top:0;">Este mês</button>
      </div>
      <button class="btn-primary" id="btn-buscar-resumo">Buscar</button>
    </div>
    <div class="card" id="card-resumo-resultado" style="display:none;"></div>
  </div>
</div>

<script>
const CONFIG = {
  // Cole aqui a URL do Web App do Apps Script (financeiro.gs)
  API_URL: "https://script.google.com/macros/s/AKfycbwE-8P0cEBLQTDQ0KsOH_5J3bAd0N8tg17VzUTIoOFaXVcfjvzm4p6OCL2WB-sWI770HA/exec"
};

const $ = (id) => document.getElementById(id);
const fmt = (v) => "R$ " + (Number(v) || 0).toFixed(2).replace(".", ",");

let USUARIO_LOGADO = "";
let PRODUTOS = [];
let CATEGORIAS = { saida: [], entrada: [] };

// ---------------------------------------------------------------------------
// Chamada genérica JSONP
// ---------------------------------------------------------------------------
let contadorCallback = 0;
function chamarApi(params) {
  return new Promise((resolve, reject) => {
    const nomeCallback = "cb_" + (contadorCallback++);
    const query = new URLSearchParams({ ...params, callback: nomeCallback });
    window[nomeCallback] = (resp) => {
      resolve(resp);
      delete window[nomeCallback];
      script.remove();
    };
    const script = document.createElement("script");
    script.src = CONFIG.API_URL + "?" + query.toString();
    script.onerror = () => reject(new Error("Falha de conexão com o servidor."));
    document.body.appendChild(script);
    setTimeout(() => {
      if (window[nomeCallback]) {
        reject(new Error("Tempo de resposta esgotado."));
        delete window[nomeCallback];
        script.remove();
      }
    }, 10000);
  });
}

// ---------------------------------------------------------------------------
// LOGIN
// ---------------------------------------------------------------------------
$("btn-login").onclick = async () => {
  const usuario = $("login-usuario").value.trim();
  const pin = $("login-pin").value.trim();
  if (!usuario || !pin) {
    $("login-status").textContent = "Preenche usuário e PIN.";
    $("login-status").style.color = "#ff8a80";
    return;
  }
  $("login-status").textContent = "Entrando...";
  $("login-status").style.color = "var(--muted)";
  try {
    const resp = await chamarApi({ acao: "login", usuario, pin });
    if (resp.status === "ok") {
      USUARIO_LOGADO = resp.usuario;
      localStorage.setItem("brasero96_fin_usuario", USUARIO_LOGADO);
      iniciarApp();
    } else {
      $("login-status").textContent = "❌ " + resp.mensagem;
      $("login-status").style.color = "#ff8a80";
    }
  } catch (e) {
    $("login-status").textContent = "❌ " + e.message;
    $("login-status").style.color = "#ff8a80";
  }
};

$("btn-sair").onclick = () => {
  localStorage.removeItem("brasero96_fin_usuario");
  location.reload();
};

async function iniciarApp() {
  $("tela-login").style.display = "none";
  $("top-bar").style.display = "flex";
  $("app").style.display = "block";
  $("usuario-logado").textContent = USUARIO_LOGADO;

  const [respProdutos, respCategorias] = await Promise.all([
    chamarApi({ acao: "listarProdutos" }),
    chamarApi({ acao: "categorias" }),
  ]);
  if (respProdutos.status === "ok") PRODUTOS = respProdutos.produtos;
  if (respCategorias.status === "ok") CATEGORIAS = respCategorias;

  montarSelectProdutoVenda();
  montarCategoriasMovimento();
  montarListaProdutosEditavel();

  const hoje = new Date().toISOString().slice(0, 10);
  $("venda-data").value = hoje;
  $("resumo-data-inicio").value = hoje;
  $("resumo-data-fim").value = hoje;
  $("mov-filtro-inicio").value = hoje;
  $("mov-filtro-fim").value = hoje;
  carregarVendasDoDia();
}

// tenta login automático se já tiver usuário salvo neste aparelho
window.addEventListener("load", () => {
  const salvo = localStorage.getItem("brasero96_fin_usuario");
  if (salvo) {
    $("login-usuario").value = salvo;
  }
});

// ---------------------------------------------------------------------------
// TABS
// ---------------------------------------------------------------------------
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("ativa"));
    document.querySelectorAll(".tab-conteudo").forEach(c => c.classList.remove("ativa"));
    btn.classList.add("ativa");
    $("tab-" + btn.dataset.tab).classList.add("ativa");
  };
});

// ---------------------------------------------------------------------------
// VENDER (carrinho)
// ---------------------------------------------------------------------------
let CARRINHO = [];

function produtosPorTipo(tipo) {
  const mapa = { "Espeto": "Espeto", "Refrigerante": "Refrigerante", "Baião de Dois": "Baião de Dois" };
  return PRODUTOS.filter(p => p.categoria === mapa[tipo]);
}

function montarSelectProdutoVenda() {
  const tipo = $("venda-tipo").value;
  const select = $("venda-produto");
  select.innerHTML = "";
  produtosPorTipo(tipo).forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.nome;
    opt.textContent = `${p.nome} (${fmt(p.preco)})`;
    select.appendChild(opt);
  });
}

$("venda-tipo").onchange = () => {
  const tipo = $("venda-tipo").value;
  const ehPacote = tipo === "Pacote";
  $("venda-campos-produto").style.display = ehPacote ? "none" : "block";
  $("venda-campos-pacote").style.display = ehPacote ? "block" : "none";
  if (!ehPacote) montarSelectProdutoVenda();
};

$("btn-add-carrinho").onclick = () => {
  const tipo = $("venda-tipo").value;
  if (tipo === "Pacote") {
    const nomeEvento = $("pacote-nome").value.trim();
    const valorTotal = Number($("pacote-valor").value) || 0;
    const custoTotal = Number($("pacote-custo").value) || 0;
    if (!nomeEvento || valorTotal <= 0) {
      $("venda-status").textContent = "Preenche o nome do evento e o valor.";
      $("venda-status").style.color = "#ff8a80";
      return;
    }
    CARRINHO.push({ tipo, produto: nomeEvento, quantidade: 1, valorUnitario: valorTotal, valorTotal, custoUnitario: custoTotal, custoTotal });
    $("pacote-nome").value = ""; $("pacote-valor").value = ""; $("pacote-custo").value = "";
  } else {
    const nomeProduto = $("venda-produto").value;
    const produto = PRODUTOS.find(p => p.nome === nomeProduto);
    const qtd = Number($("venda-quantidade").value) || 0;
    if (!produto || qtd <= 0) {
      $("venda-status").textContent = "Escolhe o produto e a quantidade.";
      $("venda-status").style.color = "#ff8a80";
      return;
    }
    CARRINHO.push({
      tipo, produto: produto.nome, quantidade: qtd,
      valorUnitario: produto.preco, valorTotal: produto.preco * qtd,
      custoUnitario: produto.custo, custoTotal: produto.custo * qtd
    });
    $("venda-quantidade").value = 1;
  }
  $("venda-status").textContent = "";
  renderizarCarrinho();
};

function renderizarCarrinho() {
  const container = $("carrinho-lista");
  container.innerHTML = "";
  let total = 0;
  CARRINHO.forEach((item, idx) => {
    total += item.valorTotal;
    const div = document.createElement("div");
    div.className = "carrinho-item";
    div.innerHTML = `
      <div class="info"><b>${item.quantidade}x ${item.produto}</b><span>${item.tipo} — ${fmt(item.valorTotal)}</span></div>
      <button class="remover">Remover</button>
    `;
    div.querySelector("button").onclick = () => { CARRINHO.splice(idx, 1); renderizarCarrinho(); };
    container.appendChild(div);
  });
  $("venda-preview").style.display = CARRINHO.length ? "block" : "none";
  $("venda-preview-valor").textContent = fmt(total);
  $("btn-registrar-venda").style.display = CARRINHO.length ? "block" : "none";
}

function dataFormularioParaBR() {
  const valor = $("venda-data").value; // yyyy-mm-dd
  const [ano, mes, dia] = valor.split("-");
  const agora = new Date();
  const hora = String(agora.getHours()).padStart(2, "0");
  const min = String(agora.getMinutes()).padStart(2, "0");
  const seg = String(agora.getSeconds()).padStart(2, "0");
  return `${dia}/${mes}/${ano} ${hora}:${min}:${seg}`;
}

$("btn-registrar-venda").onclick = async () => {
  if (!CARRINHO.length) return;
  $("venda-status").textContent = "Registrando...";
  $("venda-status").style.color = "var(--muted)";
  const dataHora = dataFormularioParaBR();
  try {
    for (const item of CARRINHO) {
      const resp = await chamarApi({ acao: "registrarVenda", usuario: USUARIO_LOGADO, dataHora, ...item });
      if (resp.status !== "ok") throw new Error(resp.mensagem);
    }
    $("venda-status").textContent = "✓ " + CARRINHO.length + " item(ns) registrado(s)!";
    $("venda-status").style.color = "var(--muted)";
    CARRINHO = [];
    renderizarCarrinho();
    carregarVendasDoDia();
  } catch (e) {
    $("venda-status").textContent = "❌ " + e.message;
    $("venda-status").style.color = "#ff8a80";
  }
};

function dataInputParaBR(valorInput) {
  const [ano, mes, dia] = valorInput.split("-");
  return `${dia}/${mes}/${ano}`;
}

async function carregarVendasDoDia() {
  const dataInput = $("venda-data").value;
  const dataBR = dataInputParaBR(dataInput);
  $("label-data-lista").textContent = dataBR;
  const container = $("lista-vendas-dia");
  container.innerHTML = `<p style="color:var(--muted); font-size:13px;">Carregando...</p>`;
  try {
    const r = await chamarApi({ acao: "listarVendasDia", data: dataBR });
    if (r.status !== "ok" || !r.registros.length) {
      container.innerHTML = `<p style="color:var(--muted); font-size:13px;">Nenhuma venda registrada nesse dia.</p>`;
      return;
    }
    container.innerHTML = r.registros.map(v => `
      <div class="registro-item">
        <div class="info"><b>${v.quantidade}x ${v.produto}</b><span>${v.tipo} · ${v.usuario} · ${v.dataHora.split(" ")[1] || ""}</span></div>
        <span class="valor entrada">${fmt(v.valorTotal)}</span>
      </div>
    `).join("") + `<div class="dia-total-linha"><span>Total do dia</span><b>${fmt(r.total)}</b></div>`;
  } catch (e) {
    container.innerHTML = `<p style="color:#ff8a80; font-size:13px;">${e.message}</p>`;
  }
}
$("venda-data").onchange = carregarVendasDoDia;

// ---------------------------------------------------------------------------
// SAÍDA / ENTRADA
// ---------------------------------------------------------------------------
function montarCategoriasMovimento() {
  const tipo = $("mov-tipo").value;
  const select = $("mov-categoria");
  select.innerHTML = "";
  const lista = tipo === "saida" ? CATEGORIAS.saida : CATEGORIAS.entrada;
  lista.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    select.appendChild(opt);
  });
}
$("mov-tipo").onchange = montarCategoriasMovimento;

$("btn-registrar-mov").onclick = async () => {
  const tipo = $("mov-tipo").value;
  const categoria = $("mov-categoria").value;
  const descricao = $("mov-descricao").value.trim();
  const valor = Number($("mov-valor").value) || 0;
  if (valor <= 0) {
    $("mov-status").textContent = "Informa um valor válido.";
    $("mov-status").style.color = "#ff8a80";
    return;
  }
  $("mov-status").textContent = "Registrando...";
  $("mov-status").style.color = "var(--muted)";
  try {
    const acao = tipo === "saida" ? "registrarSaida" : "registrarEntrada";
    const resp = await chamarApi({ acao, usuario: USUARIO_LOGADO, categoria, descricao, valor });
    if (resp.status === "ok") {
      $("mov-status").textContent = "✓ Registrado!";
      $("mov-status").style.color = "var(--muted)";
      $("mov-descricao").value = ""; $("mov-valor").value = "";
    } else {
      $("mov-status").textContent = "❌ " + resp.mensagem;
      $("mov-status").style.color = "#ff8a80";
    }
  } catch (e) {
    $("mov-status").textContent = "❌ " + e.message;
    $("mov-status").style.color = "#ff8a80";
  }
};

$("btn-custos-fixos").onclick = async () => {
  $("custos-fixos-status").textContent = "Registrando...";
  $("custos-fixos-status").style.color = "var(--muted)";
  try {
    const resp = await chamarApi({ acao: "registrarCustosFixos", usuario: USUARIO_LOGADO });
    if (resp.status === "ok") {
      $("custos-fixos-status").textContent = "✓ Lançado: " + resp.itens.join(", ");
      $("custos-fixos-status").style.color = "var(--muted)";
    } else {
      $("custos-fixos-status").textContent = "⚠️ " + resp.mensagem;
      $("custos-fixos-status").style.color = "var(--brasero-yellow)";
    }
  } catch (e) {
    $("custos-fixos-status").textContent = "❌ " + e.message;
    $("custos-fixos-status").style.color = "#ff8a80";
  }
};

$("btn-filtrar-mov").onclick = async () => {
  const dataInicio = $("mov-filtro-inicio").value;
  const dataFim = $("mov-filtro-fim").value;
  const container = $("lista-movimentos-filtrados");
  container.innerHTML = `<p style="color:var(--muted); font-size:13px;">Buscando...</p>`;
  try {
    const r = await chamarApi({ acao: "listarMovimentos", dataInicio, dataFim });
    if (r.status !== "ok" || !r.registros.length) {
      container.innerHTML = `<p style="color:var(--muted); font-size:13px;">Nenhum registro no período.</p>`;
      return;
    }
    container.innerHTML = r.registros.map(m => `
      <div class="registro-item">
        <div class="info"><b>${m.categoria}</b><span>${m.tipoMovimento} · ${m.descricao || "-"} · ${m.dataHora}</span></div>
        <span class="valor ${m.tipoMovimento === "Saída" ? "saida" : "entrada"}">${m.tipoMovimento === "Saída" ? "-" : "+"}${fmt(m.valor)}</span>
      </div>
    `).join("");
  } catch (e) {
    container.innerHTML = `<p style="color:#ff8a80; font-size:13px;">${e.message}</p>`;
  }
};

// ---------------------------------------------------------------------------
// CUSTOS & PREÇOS
// ---------------------------------------------------------------------------
function montarListaProdutosEditavel() {
  const container = $("lista-produtos-editavel");
  container.innerHTML = "";
  const categorias = [...new Set(PRODUTOS.map(p => p.categoria))];
  categorias.forEach(cat => {
    const titulo = document.createElement("p");
    titulo.style.cssText = "margin:14px 0 4px; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--brasero-orange); font-weight:700;";
    titulo.textContent = cat;
    container.appendChild(titulo);

    PRODUTOS.filter(p => p.categoria === cat).forEach(produto => {
      const row = document.createElement("div");
      row.className = "produto-row";
      row.innerHTML = `
        <span class="nome">${produto.nome}</span>
        <span>Custo <input type="number" step="0.01" value="${produto.custo}" data-campo="custo"></span>
        <span>Venda <input type="number" step="0.01" value="${produto.preco}" data-campo="preco"></span>
        <button class="btn-green" style="width:auto; margin:0; padding:6px 10px; font-size:11px;">Salvar</button>
      `;
      const inputCusto = row.querySelector('[data-campo="custo"]');
      const inputPreco = row.querySelector('[data-campo="preco"]');
      const btnSalvar = row.querySelector("button");
      btnSalvar.onclick = async () => {
        btnSalvar.textContent = "...";
        try {
          const resp = await chamarApi({
            acao: "atualizarProduto", usuario: USUARIO_LOGADO, nome: produto.nome,
            custo: inputCusto.value, preco: inputPreco.value
          });
          if (resp.status === "ok") {
            produto.custo = Number(inputCusto.value);
            produto.preco = Number(inputPreco.value);
            btnSalvar.textContent = "✓";
            setTimeout(() => { btnSalvar.textContent = "Salvar"; }, 1500);
          } else {
            btnSalvar.textContent = "Erro";
          }
        } catch (e) {
          btnSalvar.textContent = "Erro";
        }
      };
      container.appendChild(row);
    });
  });
}

// ---------------------------------------------------------------------------
// RESUMO
// ---------------------------------------------------------------------------
$("btn-resumo-hoje").onclick = () => {
  const hoje = new Date().toISOString().slice(0, 10);
  $("resumo-data-inicio").value = hoje;
  $("resumo-data-fim").value = hoje;
  buscarResumo();
};
$("btn-resumo-mes").onclick = () => {
  const agora = new Date();
  const primeiroDia = new Date(agora.getFullYear(), agora.getMonth(), 1).toISOString().slice(0, 10);
  const hoje = agora.toISOString().slice(0, 10);
  $("resumo-data-inicio").value = primeiroDia;
  $("resumo-data-fim").value = hoje;
  buscarResumo();
};
$("btn-buscar-resumo").onclick = buscarResumo;

async function buscarResumo() {
  const dataInicio = $("resumo-data-inicio").value;
  const dataFim = $("resumo-data-fim").value;
  const card = $("card-resumo-resultado");
  card.style.display = "block";
  card.innerHTML = `<p style="text-align:center; color:var(--muted);">Buscando...</p>`;
  try {
    const r = await chamarApi({ acao: "resumo", dataInicio, dataFim });
    if (r.status !== "ok") {
      card.innerHTML = `<p style="text-align:center; color:#ff8a80;">${r.mensagem}</p>`;
      return;
    }
    const linhasPorTipo = Object.entries(r.porTipo).map(([tipo, v]) =>
      `<div class="resumo-linha"><span>${tipo}</span><b>${fmt(v.valor)}</b></div>`
    ).join("");
    const negativo = r.lucroLiquido < 0 ? "negativo" : "";
    card.innerHTML = `
      <p style="font-family:'Poppins',sans-serif; font-weight:700; color:var(--brasero-yellow); margin:0 0 10px;">Vendas por tipo</p>
      ${linhasPorTipo || '<p style="color:var(--muted); font-size:13px;">Nenhuma venda no período.</p>'}
      <div class="resumo-linha" style="margin-top:10px;"><span>Total vendido</span><b>${fmt(r.totalVendas)}</b></div>
      <div class="resumo-linha"><span>Custo dos produtos vendidos</span><b>${fmt(r.totalCustoVendas)}</b></div>
      <div class="resumo-linha"><span>Lucro bruto das vendas</span><b>${fmt(r.totalLucroVendas)}</b></div>
      <div class="resumo-linha"><span>Saídas (despesas)</span><b>-${fmt(r.totalSaidas)}</b></div>
      <div class="resumo-linha"><span>Entradas eventuais</span><b>+${fmt(r.totalEntradas)}</b></div>
      <div class="resumo-linha total ${negativo}"><span>Lucro líquido do período</span><b>${fmt(r.lucroLiquido)}</b></div>
    `;
  } catch (e) {
    card.innerHTML = `<p style="text-align:center; color:#ff8a80;">${e.message}</p>`;
  }
}
</script>
</body>
</html>
