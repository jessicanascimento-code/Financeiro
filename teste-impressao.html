<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de impressão — Brasero 96</title>
<style>
  body{ font-family:system-ui,sans-serif; padding:24px; text-align:center; background:#fff6e9; }
  h2{ color:#e0231a; }
  button{
    font-size:17px; padding:16px 26px; border:none; border-radius:10px;
    background:linear-gradient(90deg,#e0231a,#ff7a1a); color:#fff; font-weight:700; margin-top:10px;
  }
  #log{ color:#555; font-size:13px; margin-top:18px; white-space:pre-wrap; text-align:left;
        background:#fff; border:1px solid #eee; border-radius:8px; padding:12px; }
</style>
</head>
<body>
  <h2>🖨️ Teste de impressão Bluetooth</h2>
  <p>Deixe a impressora ligada e pareada, depois toque no botão.</p>

  <button id="btn1">Testar com pacote "mate.bluetoothprint"</button>
  <br>
  <button id="btn2" style="background:linear-gradient(90deg,#1d6fa5,#3aa0e8);">Testar sem indicar pacote (deixa o Android escolher)</button>

  <div id="log">Nenhum teste rodado ainda.</div>

  <script>
    const log = document.getElementById('log');
    const conteudoTeste = "<111>BRASERO 96\n<100>Teste de impressao\n<100>Se isso saiu no papel, funcionou!\n";

    function dispararIntent(comPacote) {
      const partes = [
        "action=android.intent.action.SEND",
        comPacote ? "package=mate.bluetoothprint" : null,
        "type=text/plain",
        "S.android.intent.extra.TEXT=" + encodeURIComponent(conteudoTeste),
        "end"
      ].filter(Boolean);
      const url = "intent://send/#Intent;" + partes.join(";");
      log.textContent = "Tentando abrir:\n" + url + "\n\n(se nada acontecer, ou aparecer 'não é possível abrir', o pacote está errado ou o navegador não suporta)";
      window.location.href = url;
    }

    document.getElementById('btn1').onclick = () => dispararIntent(true);
    document.getElementById('btn2').onclick = () => dispararIntent(false);
  </script>
</body>
</html>
